models:
  - name: order_items
    description: "Order items fact table containing details of each item in an order, including product information, quantity, unit price, and total price. One row per order item."
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Identifier for the order to which the item belongs."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: "Identifier for the product included in the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: "The status of the order, which can be one of the following values: placed, shipped, delivered, or cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'cancelled']
      - name: quantity
        description: "The quantity of the product ordered."
        data_tests:
          - not_null
      - name: unit_price
        description: "The price per unit of the product at the time of the order."
        data_tests:
          - not_null
      - name: order_date
        description: "The date when the order item was created."
        data_tests:
          - not_null